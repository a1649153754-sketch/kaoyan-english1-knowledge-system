[project]
site_name = "考研英语一知识体系"
site_description = "可持续迭代的考研英语一知识框架、规则卡、母题、边界库与错题闭环。"
site_author = "考研英语一知识体系贡献者"
copyright = "Copyright &copy; 2026 考研英语一知识体系贡献者"
docs_dir = "docs"
site_dir = "site"
site_url = "https://a1649153754-sketch.github.io/kaoyan-english1-knowledge-system/"
repo_url = "https://github.com/a1649153754-sketch/kaoyan-english1-knowledge-system"
repo_name = "a1649153754-sketch/kaoyan-english1-knowledge-system"
edit_uri = "edit/main/docs/"
extra_css = ["assets/stylesheets/extra.css"]
nav = [
  { "首页" = "index.md" },
  { "体系总览" = "00-overview.md" },
  { "核心能力" = [
    { "词汇与语义" = "01-vocabulary.md" },
    { "语法与长难句" = "02-grammar-long-sentences.md" },
    { "完形填空" = "03-cloze.md" },
    { "阅读理解 A" = "04-reading.md" },
    { "新题型" = "05-new-question-types.md" },
    { "英译汉" = "06-translation.md" },
    { "写作" = "07-writing.md" },
    { "跨模块方法" = "08-method-library.md" },
  ] },
  { "复习系统" = [
    { "复习闭环" = "09-maintenance-loop.md" },
    { "三级检查清单" = "10-checklists.md" },
    { "核心规则卡" = "11-rule-cards.md" },
    { "任务决策树" = "12-decision-trees.md" },
    { "真题母题索引" = "13-problem-archetypes.md" },
    { "错误边界库" = "14-counterexamples.md" },
  ] },
  { "个性化与维护" = [
    { "个人疑问挂接" = "15-personal-links.md" },
    { "复习记录模板" = "16-review-templates.md" },
    { "项目维护指南" = "17-project-maintenance.md" },
    { "官方范围与年度核对" = "18-official-scope.md" },
  ] },
]

[project.theme]
language = "zh"
features = [
  "content.code.copy", "content.footnote.tooltips", "content.tooltips",
  "navigation.footer", "navigation.path", "navigation.sections",
  "navigation.tabs", "navigation.tabs.sticky", "navigation.top",
  "navigation.tracking", "search.highlight", "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换到浅色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "跟随系统外观"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
