name: 学习问题
description: 提交可挂接到节点的学习疑问
title: "[问题] "
body:
  - type: input
    id: source
    attributes:
      label: 来源（年份/题号，不粘贴全文）
  - type: textarea
    id: question
    attributes:
      label: 具体疑问
    validations:
      required: true
  - type: input
    id: nodes
    attributes:
      label: 可能关联节点
